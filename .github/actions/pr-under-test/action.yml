name: pr-under-test
description: The PR a pull_request or merge_group run judges, and the commit its own changes are diffed against.

outputs:
  number:
    description: The PR's number; in a merge group, the PR this entry adds to the queue.
    value: ${{ steps.pr.outputs.number }}
  base:
    description: "origin/<base branch> for a PR; in a merge group, the commit of the entry ahead (or main), so the diff is this PR's alone."
    value: ${{ steps.pr.outputs.base }}

runs:
  using: composite
  steps:
    - id: pr
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BASE: ${{ github.event.pull_request.base.ref }}
        GROUP_REF: ${{ github.event.merge_group.head_ref }}
        GROUP_BASE: ${{ github.event.merge_group.base_sha }}
      run: |
        set -euo pipefail
        case "$EVENT" in
          pull_request)
            number="$PR_NUMBER"
            base="origin/$PR_BASE"
            ;;
          merge_group)
            if [[ ! "$GROUP_REF" =~ /pr-([0-9]+)-[0-9a-f]+$ ]]; then
              echo "::error::no PR number in merge group ref $GROUP_REF"
              exit 1
            fi
            number="${BASH_REMATCH[1]}"
            base="$GROUP_BASE"
            ;;
          *)
            echo "::error::a $EVENT run judges no PR"
            exit 1
            ;;
        esac
        echo "number=$number" >> "$GITHUB_OUTPUT"
        echo "base=$base" >> "$GITHUB_OUTPUT"
        echo "Judging PR #$number against $base"
