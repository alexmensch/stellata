name: cache-cleanup

on:
  pull_request:
    types: [closed]

permissions:
  actions: write

jobs:
  delete:
    name: Delete the pull request's caches
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -o pipefail
          gh cache list --ref "$REF" --limit 1000 --json id --jq '.[].id' | xargs -r -n1 gh cache delete
