name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:catalog
      # The known-stars corpus harness needs public/catalog.bin (built
      # in the step above) and the LFS-tracked data/binaries/multiples.tsv.
      # The bare `test` job already runs the rest of vitest and self-skips
      # this suite; run just the corpus file here so we don't re-execute
      # the full ~1250-test suite.
      - run: npx vitest run scripts/catalog/known-stars.test.ts
