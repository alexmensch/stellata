name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          # Full history so the SID ledger guard can resolve the
          # merge-base against origin/main for its append-only check.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:catalog
      # The known-stars corpus harness needs the catalog chunks + manifest
      # (built in the step above) and the LFS-tracked data/binaries/multiples.tsv.
      # The bare `test` job already runs the rest of vitest and self-skips
      # this suite; run just the corpus file here so we don't re-execute
      # the full ~1250-test suite.
      - run: npx vitest run scripts/catalog/known-stars.test.ts
      # These two self-skip in the bare `test` job (LFS pointer stubs);
      # this job has real LFS content, so they bite here.
      - run: npx vitest run tests/sid-ledger-guard.test.ts scripts/sid/dr-reconcile-pure.test.ts
