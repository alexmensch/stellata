name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Warms the shared LFS object cache (see .github/actions/lfs-cache)
  # so the data-consuming jobs below restore ~600 MB from the Actions
  # cache instead of each pulling it from the LFS store.
  lfs-data:
    name: Data cache (LFS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-cache

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  # Full vitest without LFS content — the data-dependent suites see
  # pointer stubs and self-skip; they run for real in the jobs below.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Reproducibility: the committed multiples.tsv (and the astrometry
  # request list) must be exactly what the committed pipeline code
  # produces — a stage change can't land with a stale artifact. The
  # build also asserts the Stage-7 count/rate snapshots.
  build-binaries:
    name: Multi-star pipeline rebuild
    runs-on: ubuntu-latest
    needs: lfs-data
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-cache
      - run: python3 scripts/binaries/build-binaries.py --force
      - run: |
          git diff --exit-code -- data/binaries/multiples.tsv \
            data/gaia/gaia_astrometry_source_id_request.tsv || {
            echo "::error::committed pipeline outputs are stale — run" \
              "'pnpm run build:binaries' and commit the regenerated files";
            exit 1;
          }

  # Stage 2 resolution asserted against the curated 93-system ground
  # truth (data/binaries/spot_check_ground_truth.tsv).
  spotcheck:
    name: Resolution spot-check corpus
    runs-on: ubuntu-latest
    needs: lfs-data
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-cache
      - run: python3 scripts/binaries/build-binaries-spotcheck.py

  build-catalog:
    name: Catalogue, clouds & Local Group build
    runs-on: ubuntu-latest
    needs: lfs-data
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-cache
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Same reproducibility contract as multiples.tsv above: the committed
      # overlay must be exactly what the committed join produces.
      - run: pnpm run build:classic-ids
      - run: |
          git diff --exit-code -- data/classic-ids/ || {
            echo "::error::committed classic-ID overlay is stale — run" \
              "'pnpm run build:classic-ids' and commit the regenerated files";
            exit 1;
          }
      # Hard-fails on any record the SID ledger doesn't cover (the mint
      # side of ledger consistency; the drop side is the job below).
      - run: pnpm run build:catalog
      - run: pnpm run build:clouds
      - run: pnpm run build:local-group
      - uses: actions/upload-artifact@v7
        with:
          name: public-artifacts
          path: public/
          retention-days: 1

  # Ledger ↔ artifact consistency, drop side (docs/sid.md § 4.5):
  # read-only allocation walk over the built artifacts; fails on any
  # would-mint object or orphaned synth key, so an object-set change
  # can't land without its allocation / retirement / bridge.
  sid-consistency:
    name: SID ledger–artifact consistency
    runs-on: ubuntu-latest
    needs: build-catalog
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-cache
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: public-artifacts
          path: public/
      - run: pnpm run sid:check

  # Tier-A validation against the built artifacts: the known-stars
  # corpus plus the multi-star render-geometry regression (which needs
  # public/binaries.bin, built here from the committed multiples.tsv).
  tier-a-corpus:
    name: Tier-A star corpus
    runs-on: ubuntu-latest
    needs: build-catalog
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-cache
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: public-artifacts
          path: public/
      - run: pnpm run build:binaries-runtime
      - run: pnpm exec vitest run scripts/catalog/validate/known-stars.test.ts scripts/catalog/companions/multi-star-regression.test.ts scripts/catalog/validate/sky-position.test.ts scripts/clouds/clouds-json.test.ts scripts/dust/dust-manifest.test.ts

  # Append-only ledger guard (needs full history for the merge-base
  # read) + the DR-reconciliation classifier against its committed
  # dry-run snapshots. Both self-skip in the bare `test` job.
  sid-ledger-guard:
    name: SID ledger append-only guard
    runs-on: ubuntu-latest
    needs: lfs-data
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/lfs-cache
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/sid-ledger-guard.test.ts scripts/sid/dr-reconcile-pure.test.ts
