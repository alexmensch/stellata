name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Warms the shared LFS object cache (see .github/actions/lfs-cache)
  # so the data-consuming jobs below restore ~600 MB from the Actions
  # cache instead of each pulling it from the LFS store.
  lfs-data:
    name: Data cache (LFS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-cache

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  # Full vitest without LFS content — the data-dependent suites see
  # pointer stubs and self-skip; they run for real in the jobs below.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      # Full history and tags, not past file contents: the site figures read the release a commit builds on.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # see /scripts/ci/README.md#python-suites
  python-tests:
    name: Python suites
    runs-on: ubuntu-latest
    needs: lfs-data
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-cache
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: |
            scripts/refresh/requirements-refresh.txt
            scripts/textures/requirements.txt
      - run: pip install -r scripts/refresh/requirements-refresh.txt -r scripts/textures/requirements.txt
      - run: python scripts/ci/python_tests.py

  # Stage 2 resolution asserted against the curated ground truth
  # (data/binaries/spot_check_ground_truth.tsv).
  spotcheck:
    name: Resolution spot-check corpus
    runs-on: ubuntu-latest
    needs: lfs-data
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-cache
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:spotcheck

  build-catalog:
    name: Catalogue, clouds & Local Group build
    runs-on: ubuntu-latest
    needs: lfs-data
    steps:
      # Full history: tests/sid-ledger-guard.test.ts reads the merge-base, the
      # data build cache key reads HEAD^1, and the build records the release
      # tag HEAD builds on.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/lfs-cache
      - id: python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: pnpm/action-setup@v6
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # see /scripts/ci/README.md#the-data-build-cache
      - id: build-cache
        env:
          PREFIX: data-build-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('pnpm-lock.yaml') }}-
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              own="${PREFIX}pr-$(git rev-parse HEAD^1)-"
              {
                echo "key=${own}${RUN}"
                printf 'restore-keys<<EOF\n%s\n%s\nEOF\n' "$own" "${PREFIX}main-"
                echo "own-older=${PREFIX}pr-"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "key=${PREFIX}main-${RUN}" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - id: restore
        if: github.event_name != 'push'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/data-build.tar
          key: ${{ steps.build-cache.outputs.key }}
          restore-keys: ${{ steps.build-cache.outputs.restore-keys }}
      - id: restore-own-older
        if: github.event_name == 'pull_request' && steps.restore.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/data-build.tar
          key: ${{ steps.build-cache.outputs.key }}
          restore-keys: ${{ steps.build-cache.outputs.own-older }}
      - if: steps.restore.outputs.cache-matched-key != '' || steps.restore-own-older.outputs.cache-matched-key != ''
        run: tar --skip-old-files -xf "$RUNNER_TEMP/data-build.tar"
      - id: built
        run: pnpm run build:data --verify-committed ${{ github.event_name == 'push' && '--force' || '' }}
      # A tracked file must never come from a cache: only untracked files are
      # saved, and the restore skips any path the checkout already has, which
      # covers a file tracked since the build was saved.
      - if: ${{ !cancelled() && steps.built.outputs.built == 'true' }}
        run: |
          set -o pipefail
          pnpm exec tsx scripts/ci/saved-build.ts | tar --null -T - -cf "$RUNNER_TEMP/data-build.tar"
      - if: ${{ !cancelled() && steps.built.outputs.built == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/data-build.tar
          key: ${{ steps.build-cache.outputs.key }}
      # see /scripts/ci/README.md#vitest-with-every-input
      - name: Full vitest, smudged and built
        if: ${{ !cancelled() && steps.built.outcome == 'success' }}
        run: pnpm run test:no-skip
      - id: deploy-build
        if: ${{ !cancelled() && steps.built.outcome == 'success' }}
        run: pnpm run build:client
      - name: Deploy asset sizes
        if: ${{ !cancelled() && steps.deploy-build.outcome == 'success' }}
        run: pnpm run check:asset-sizes
