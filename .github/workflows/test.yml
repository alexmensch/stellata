name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Warms the shared LFS object cache (see .github/actions/lfs-cache)
  # so the data-consuming jobs below restore ~600 MB from the Actions
  # cache instead of each pulling it from the LFS store.
  lfs-data:
    name: Data cache (LFS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-cache

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  # Full vitest without LFS content — the data-dependent suites see
  # pointer stubs and self-skip; they run for real in the jobs below.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Reproducibility: the committed multiples.tsv (and the astrometry
  # request list) must be exactly what the committed pipeline code
  # produces — a stage change can't land with a stale artifact. The
  # build also asserts the Stage-7 count/rate snapshots.
  build-binaries:
    name: Multi-star pipeline rebuild
    runs-on: ubuntu-latest
    needs: lfs-data
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-cache
      - run: python3 scripts/binaries/build-binaries.py --force
      - run: |
          git diff --exit-code -- data/binaries/multiples.tsv \
            data/gaia/gaia_astrometry_source_id_request.tsv || {
            echo "::error::committed pipeline outputs are stale — run" \
              "'pnpm run build:binaries' and commit the regenerated files";
            exit 1;
          }

  # Stage 2 resolution asserted against the curated 93-system ground
  # truth (data/binaries/spot_check_ground_truth.tsv).
  spotcheck:
    name: Resolution spot-check corpus
    runs-on: ubuntu-latest
    needs: lfs-data
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-cache
      - run: python3 scripts/binaries/build-binaries-spotcheck.py

  build-catalog:
    name: Catalogue, clouds & Local Group build
    runs-on: ubuntu-latest
    needs: lfs-data
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-cache
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The regenerate-and-diff stage below is a pure function of the files
      # this key digests (scripts/ci/README.md), so a PR whose key matches a
      # saved build restores that build's outputs and skips the stage. Push
      # to main always rebuilds, so every merged commit is verified uncached.
      - id: catalog-key
        run: |
          key=$(pnpm exec tsx scripts/ci/catalog-stage.ts key)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - id: catalog-cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/catalog-build.tar
          key: ${{ steps.catalog-key.outputs.key }}
      - if: steps.catalog-cache.outputs.cache-hit == 'true'
        run: tar -xf "$RUNNER_TEMP/catalog-build.tar"
      # build:catalog hard-fails on any record the SID ledger doesn't cover
      # (the mint side of ledger consistency; the drop side is sid:check).
      - if: steps.catalog-cache.outputs.cache-hit != 'true'
        run: pnpm exec tsx scripts/ci/catalog-stage.ts run
      # On a fresh checkout the stage's untracked files under public/ and
      # build/ are exactly its outputs; the tracked icons and manifest there
      # must never be restored from a cache.
      - if: steps.catalog-cache.outputs.cache-hit != 'true'
        run: git ls-files -z --others --ignored --exclude-standard public build | tar --null -T - -cf "$RUNNER_TEMP/catalog-build.tar"
      - if: steps.catalog-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/catalog-build.tar
          key: ${{ steps.catalog-key.outputs.key }}
      - id: built
        run: pnpm run build:layers
      # Ledger ↔ artifact consistency, drop side (docs/sid.md § 4.5):
      # read-only allocation walk over the built artifacts; fails on any
      # would-mint object or orphaned synth key, so an object-set change
      # can't land without its allocation / retirement / bridge.
      - name: SID ledger–artifact consistency
        if: ${{ !cancelled() && steps.built.outcome == 'success' }}
        run: pnpm run sid:check
      # Tier-A validation against the built artifacts: the known-stars
      # corpus plus the multi-star render-geometry regression (which needs
      # public/binaries.bin, built here from the committed multiples.tsv).
      # Also the home for LFS-gated catalogue-wide sweeps that self-skip in
      # the bare `test` job — every such suite must be named in the vitest
      # invocation below, or it never runs smudged anywhere.
      - name: Tier-A star corpus
        if: ${{ !cancelled() && steps.built.outcome == 'success' }}
        run: pnpm exec vitest run scripts/catalog/validate/known-stars.test.ts scripts/catalog/companions/multi-star-regression.test.ts scripts/catalog/validate/sky-position.test.ts scripts/catalog/membership/membership-manifest-gate.test.ts scripts/clouds/clouds-json.test.ts scripts/dust/dust-manifest.test.ts src/client/constellation-boundaries/iau-geometry/iau-athyg-agreement.test.ts
      # The exact build deploy.yml ships (`pnpm run build`, whose remaining
      # stages are build:binaries — pinned to the committed multiples.tsv by
      # build-binaries above — and build:catalog, done here), checked against
      # the Cloudflare Workers per-asset limit; wrangler otherwise only
      # rejects it after merge.
      - id: deploy-build
        if: ${{ !cancelled() && steps.built.outcome == 'success' }}
        run: pnpm run build:client
      - name: Deploy asset sizes
        if: ${{ !cancelled() && steps.deploy-build.outcome == 'success' }}
        run: pnpm run check:asset-sizes

  # Append-only ledger guard (needs full history for the merge-base
  # read), the DR-reconciliation classifier against its committed dry-run
  # snapshots, and the swap parity ledger's ledger/spine/V-50 gates. All
  # self-skip in the bare `test` job.
  sid-ledger-guard:
    name: SID ledger append-only guard
    runs-on: ubuntu-latest
    needs: lfs-data
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/lfs-cache
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/sid-ledger-guard.test.ts scripts/sid/dr-reconcile-pure.test.ts scripts/catalog/classic-ids/parity-ledger.test.ts
