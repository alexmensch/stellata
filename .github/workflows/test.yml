name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Warms the shared LFS object cache (see .github/actions/lfs-cache)
  # so the data-consuming jobs below restore ~600 MB from the Actions
  # cache instead of each pulling it from the LFS store.
  lfs-data:
    name: Data cache (LFS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-cache

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  # Full vitest without LFS content — the data-dependent suites see
  # pointer stubs and self-skip; they run for real in the jobs below.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # see /scripts/ci/README.md#python-suites
  python-tests:
    name: Python suites
    runs-on: ubuntu-latest
    needs: lfs-data
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-cache
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: |
            scripts/refresh/requirements-refresh.txt
            scripts/textures/requirements.txt
      - run: pip install -r scripts/refresh/requirements-refresh.txt -r scripts/textures/requirements.txt
      - run: python scripts/ci/python_tests.py

  # Reproducibility: the committed multiples.tsv (and the astrometry
  # request list) must be exactly what the committed pipeline code
  # produces — a stage change can't land with a stale artifact. The
  # build also asserts the Stage-7 count/rate snapshots.
  build-binaries:
    name: Multi-star pipeline rebuild
    runs-on: ubuntu-latest
    needs: lfs-data
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-cache
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:binaries
      - run: |
          git diff --exit-code -- data/binaries/multiples.tsv \
            data/gaia/gaia_astrometry_source_id_request.tsv || {
            echo "::error::committed pipeline outputs are stale — run" \
              "'pnpm run build:binaries' and commit the regenerated files";
            exit 1;
          }

  # Stage 2 resolution asserted against the curated 93-system ground
  # truth (data/binaries/spot_check_ground_truth.tsv).
  spotcheck:
    name: Resolution spot-check corpus
    runs-on: ubuntu-latest
    needs: lfs-data
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-cache
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python3 scripts/binaries/build-binaries-spotcheck.py

  build-catalog:
    name: Catalogue, clouds & Local Group build
    runs-on: ubuntu-latest
    needs: lfs-data
    steps:
      # Full history: tests/sid-ledger-guard.test.ts reads the merge-base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/lfs-cache
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # see /scripts/ci/README.md#the-catalogue-build-cache
      - id: catalog-key
        run: |
          key=$(pnpm exec tsx scripts/ci/catalog-stage.ts key)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - id: catalog-cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/catalog-build.tar
          key: ${{ steps.catalog-key.outputs.key }}
      - if: steps.catalog-cache.outputs.cache-hit == 'true'
        run: tar -xf "$RUNNER_TEMP/catalog-build.tar"
      # build:catalog allocates SIDs; the stage's diff gate fails on any
      # ledger or events row the PR did not commit.
      - if: steps.catalog-cache.outputs.cache-hit != 'true'
        run: pnpm exec tsx scripts/ci/catalog-stage.ts run
      # On a fresh checkout the stage's untracked files under public/ and
      # build/ are exactly its outputs; the tracked icons and manifest there
      # must never be restored from a cache.
      - if: steps.catalog-cache.outputs.cache-hit != 'true'
        run: git ls-files -z --others --ignored --exclude-standard public build | tar --null -T - -cf "$RUNNER_TEMP/catalog-build.tar"
      - if: steps.catalog-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/catalog-build.tar
          key: ${{ steps.catalog-key.outputs.key }}
      - id: built
        run: pnpm run build:layers
      # A mint or event build:clouds or build:local-group appends
      # (/docs/sid.md#45-ci-guard), or a change to the dust bake's column-check
      # inputs build:clouds writes, that the PR did not commit fails here.
      - name: Layer outputs committed
        if: ${{ !cancelled() && steps.built.outcome == 'success' }}
        run: git diff --exit-code -- data/sid data/molecular-clouds
      # see /scripts/ci/README.md#vitest-with-every-input
      - name: Full vitest, smudged and built
        if: ${{ !cancelled() && steps.built.outcome == 'success' }}
        run: pnpm run test:no-skip
      - id: deploy-build
        if: ${{ !cancelled() && steps.built.outcome == 'success' }}
        run: pnpm run build:client
      - name: Deploy asset sizes
        if: ${{ !cancelled() && steps.deploy-build.outcome == 'success' }}
        run: pnpm run check:asset-sizes
