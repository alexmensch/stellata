name: version-guard

on:
  pull_request:
    branches: [main]
    # `labeled` / `unlabeled` so the check re-runs when a level label changes.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

permissions:
  contents: read
  pull-requests: read

# see /.github/workflows/README.md#version-guardyml

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/release
            scripts/util
            .github/actions
      - id: pr
        uses: ./.github/actions/pr-under-test
      - uses: ./.github/actions/release-level
        with:
          pr: ${{ steps.pr.outputs.number }}
