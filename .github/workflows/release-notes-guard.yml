name: release-notes-guard

on:
  pull_request:
    branches: [main]
    # `edited` so the check re-runs when the body is updated;
    # `labeled` / `unlabeled` so it re-runs when a level label changes.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

# see /.github/workflows/README.md#release-notes-guardyml

jobs:
  release-notes-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/release
            scripts/util
            .github/actions
      - id: level
        uses: ./.github/actions/release-level
        with:
          pr: ${{ github.event.pull_request.number }}
      - name: Check `## Release notes` section is present and non-empty
        if: steps.level.outputs.level != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$REPO" --json body -q .body > "$RUNNER_TEMP/body.md"
          node scripts/release/release-notes-check.ts "$RUNNER_TEMP/body.md"
