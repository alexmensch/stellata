name: release-notes-guard

on:
  pull_request:
    branches: [main]
    # `edited` so the check re-runs when the body is updated;
    # `labeled` / `unlabeled` so it re-runs when the label changes.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

# Asserts the PR body contains a non-empty `## Release notes` section.
# `deploy.yml` extracts that section and uses it as the GitHub release
# notes for the version this PR ships, so an empty section means an
# empty release page. Pure metadata PRs (`skip-version-bump` label)
# don't ship a release and are exempt.

jobs:
  release-notes-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/release
            .github/actions/skip-version-bump
      - id: skip
        uses: ./.github/actions/skip-version-bump
      - if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check `## Release notes` section is present and non-empty
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$REPO" --json body -q .body > "$RUNNER_TEMP/body.md"
          node scripts/release/release-notes-check.ts "$RUNNER_TEMP/body.md"
