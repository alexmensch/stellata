name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

# Every push to main plans the releases since the last one pushed:
# scripts/release/cut-releases.ts walks from the newest release tag's commit
# and derives each commit's version from the release before it plus the
# level its PR's label declares, so a cancelled or failed run's commits are
# planned by the next. The deploy runs only when the range ships one. The
# tags are made locally before the build, which reads its version from the
# newest of them, and pushed with each release only once the checked version
# is live. Rationale: /scripts/release/README.md.

jobs:
  plan-releases:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            scripts/release
            scripts/util

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/cut-releases.ts plan --head "$GITHUB_SHA"

  deploy:
    needs: plan-releases
    if: needs.plan-releases.outputs.releases != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/lfs-cache

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - run: pnpm install --frozen-lockfile

      - name: Tag releases locally
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ needs.plan-releases.outputs.base }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          node scripts/release/cut-releases.ts tag --base "$BASE" --head "$GITHUB_SHA"

      - run: pnpm run build

      - run: pnpm run check:asset-sizes

      - name: Upload version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          set -euo pipefail
          pnpm exec wrangler versions upload --message "$GITHUB_SHA"
          pnpm exec tsx scripts/release/version-upload.ts "$WRANGLER_OUTPUT_FILE_PATH"

      - name: Pre-traffic check
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
        run: pnpm exec tsx scripts/release/pre-traffic-check.ts "$PREVIEW_URL"

      # triggers deploy applies wrangler.toml's routes, custom domain and
      # preview_urls, which neither versions command does.
      - name: Deploy checked version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: |
          set -euo pipefail
          pnpm exec wrangler versions deploy "$VERSION_ID@100%" --message "$GITHUB_SHA" --yes
          pnpm exec wrangler triggers deploy

      - name: Publish releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ needs.plan-releases.outputs.base }}
        run: node scripts/release/cut-releases.ts publish --base "$BASE" --head "$GITHUB_SHA"
