name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

# Triggered on every push to main (i.e. PR merge), but the deploy job
# only runs when package.json#version changed across the pushed range.
# This pairs with version-guard.yml on PRs: PRs that touch shipped code
# must bump the version, and that bump is what fires the deploy.
# Pure-metadata PRs (skip-version-bump label) leave the version alone
# and therefore don't redeploy.
#
# The comparison is against the push's base commit, not HEAD~1: merging
# a stack lands N commits in ONE push event, and each of those commits
# may carry its own bump. Cloudflare gets one deploy, at HEAD, but
# scripts/release/cut-releases.ts then cuts a tag + GitHub release for
# EVERY bumped commit in the range, each with its own PR's `## Release
# notes` section (enforced by release-notes-guard.yml). Falls back to
# GitHub's auto-generated notes when a PR body has no usable section.

jobs:
  detect-version-change:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      base: ${{ steps.check.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          new=$(jq -r .version package.json)

          # A force-push (or the branch's first push) leaves `before`
          # pointing at a commit this clone doesn't have; fall back to
          # the single-commit comparison.
          base=""
          if [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then
            base=$(git rev-parse HEAD~1)
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

          if [ -n "$base" ]; then
            old=$(git show "$base:package.json" | jq -r .version)
          else
            old=""
          fi
          echo "Current version: $new"
          echo "Base version: ${old:-<none>} (base: ${base:-<none>})"
          if [ "$new" = "$old" ]; then
            echo "Version unchanged — skipping deploy."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version changed — deploying."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: detect-version-change
    if: needs.detect-version-change.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/lfs-cache

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run check:asset-sizes

      - name: Upload version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          set -euo pipefail
          pnpm exec wrangler versions upload --message "$GITHUB_SHA"
          pnpm exec tsx scripts/release/version-upload.ts "$WRANGLER_OUTPUT_FILE_PATH"

      - name: Pre-traffic check
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
        run: pnpm exec tsx scripts/release/pre-traffic-check.ts "$PREVIEW_URL"

      # triggers deploy applies wrangler.toml's routes, custom domain and
      # preview_urls, which neither versions command does.
      - name: Deploy checked version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: |
          set -euo pipefail
          pnpm exec wrangler versions deploy "$VERSION_ID@100%" --message "$GITHUB_SHA" --yes
          pnpm exec wrangler triggers deploy

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ needs.detect-version-change.outputs.base }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          pnpm exec tsx scripts/release/cut-releases.ts \
            --base "$BASE" --head "$GITHUB_SHA"
