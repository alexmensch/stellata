name: perf-section-guard

on:
  pull_request:
    branches: [main]
    # `edited` so the check re-runs when the body is updated.
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read
  pull-requests: read

# Asserts that a PR whose diff touches a render path, or moves catalogue
# membership by more than 1 %, carries a non-empty `## Perf` section with an
# `accepted:` line for every ✗ row, and a table row under a Tier 1 or 2
# claim. CI has no GPU, so this checks the section,
# not the numbers — the runner produces those on the developer's machine.
# Rules: /RELEASING.md#perf-pin; the check itself is
# scripts/perf/perf-section-check.sh so it can be tested.

jobs:
  perf-section-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pr
        uses: ./.github/actions/pr-under-test
      - name: Check the `## Perf` section
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          BASE: ${{ steps.pr.outputs.base }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$REPO" --json body -q .body > "$RUNNER_TEMP/body.md"
          bash scripts/perf/perf-section-guard.sh "$RUNNER_TEMP/body.md" "$BASE"
