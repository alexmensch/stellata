# Project settings for omp. The guard extension in .omp/extensions/ carries
# everything that needs code; this file carries only what omp's own approval
# layer expresses better than a tool_call handler could.

tools:
  # `eval` and `hub` reach the filesystem through routes no static argument
  # names — a persistent kernel, and an arbitrary `application` + `args`. The
  # bridge classifies neither, so they are routed to the operator instead.
  # `tools.approval` is honoured in every mode, including the machine-wide
  # `yolo`, which is why this does not need `approvalMode` and must not set it.
  approval:
    eval: prompt
    hub: prompt
