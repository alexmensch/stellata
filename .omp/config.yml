# Project settings for the omp harness. Global settings live in
# ~/.omp/agent/config.yml; this file carries only what is stellata-specific.
# See .omp/README.md for why each key is here and which ones are absent.

extensions:
  - ./scripts/hooks/omp-bridge.ts

# omp-bridge.ts enforces the worktree rule itself, sharing one tested path
# extractor with the README guard. The machine-wide extension is the fallback
# for repos that carry no bridge; two copies running here would drift.
disabledExtensions:
  - extension-module:worktree-guard

advisor:
  enabled: true
